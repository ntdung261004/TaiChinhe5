<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tài chính E5{% endblock %}</title>
    
    <!-- Link Offline thay cho CDN -->
    <script src="{{ url_for('static', filename='vendor/tailwind.js') }}"></script>
    <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981', 600: '#059669' },
                        slate: { 50: '#f8fafc', 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #f1f5f9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="text-slate-800 antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR (Hover to expand) -->
    <aside class="group fixed inset-y-0 left-0 z-50 flex flex-col bg-slate-900 shadow-2xl transition-all duration-300 ease-in-out w-20 hover:w-72">
        
        <!-- Logo Area -->
        <div class="flex items-center justify-center h-20 border-b border-slate-800">
            <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-lg shadow-emerald-500/30 flex-shrink-0">
                <i class="fa-solid fa-shield text-white text-xl"></i>
            </div>
            <!-- Chữ này sẽ hiện ra khi hover -->
            <div class="ml-4 whitespace-nowrap opacity-0 transition-opacity duration-300 group-hover:opacity-100 overflow-hidden">
                <h1 class="text-white font-bold text-lg tracking-wide">TÀI CHÍNH E5</h1>
                <p class="text-slate-400 text-xs">Quản lý nội bộ</p>
            </div>
        </div>

        <!-- Menu Items -->
        <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto">
            <a href="/dashboard" class="flex items-center px-3 py-3 text-slate-400 rounded-xl transition-all duration-200 hover:bg-slate-800 hover:text-white {% if request.path == '/' %}bg-emerald-600 text-white shadow-md shadow-emerald-600/20{% endif %} relative">
                <i class="fa-solid fa-border-all text-xl w-8 text-center flex-shrink-0"></i>
                <span class="ml-3 font-medium whitespace-nowrap opacity-0 transition-opacity duration-300 group-hover:opacity-100">Tổng quan</span>
            </a>

            <a href="/nhan-su" class="flex items-center px-3 py-3 text-slate-400 rounded-xl transition-all duration-200 hover:bg-slate-800 hover:text-white {% if request.path == '/nhan-su' %}bg-emerald-600 text-white shadow-md shadow-emerald-600/20{% endif %} relative">
                <i class="fa-solid fa-user-shield text-xl w-8 text-center flex-shrink-0"></i>
                <span class="ml-3 font-medium whitespace-nowrap opacity-0 transition-opacity duration-300 group-hover:opacity-100">Hồ sơ Người HL</span>
            </a>

            <a href="/bang-luong" class="flex items-center px-3 py-3 text-slate-400 rounded-xl transition-all duration-200 hover:bg-slate-800 hover:text-white relative">
                <i class="fa-solid fa-file-invoice-dollar text-xl w-8 text-center flex-shrink-0"></i>
                <span class="ml-3 font-medium whitespace-nowrap opacity-0 transition-opacity duration-300 group-hover:opacity-100">Bảng lương tháng</span>
            </a>

            <a href="#" class="flex items-center px-3 py-3 text-slate-400 rounded-xl transition-all duration-200 hover:bg-slate-800 hover:text-white relative">
                <i class="fa-solid fa-chart-pie text-xl w-8 text-center flex-shrink-0"></i>
                <span class="ml-3 font-medium whitespace-nowrap opacity-0 transition-opacity duration-300 group-hover:opacity-100">Báo cáo & Xuất Excel</span>
            </a>
        </nav>

        <!-- User Profile (Bottom) -->
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center px-2 py-2 rounded-xl bg-slate-800/50 cursor-pointer hover:bg-slate-800 transition-colors">
                <img src="https://ui-avatars.com/api/?name=TC&background=10b981&color=fff&rounded=true" alt="Avatar" class="w-10 h-10 rounded-full flex-shrink-0">
                <div class="ml-3 whitespace-nowrap opacity-0 transition-opacity duration-300 group-hover:opacity-100 overflow-hidden">
                    <p class="text-sm font-semibold text-white">Trợ lý Tài chính</p>
                    <p class="text-xs text-slate-400">Admin</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <!-- Dùng ml-20 để chừa khoảng trống cho sidebar đang thu gọn -->
    <main class="flex-1 ml-20 flex flex-col h-screen transition-all duration-300">
        
        <!-- Header (Kính mờ) -->
        <header class="h-20 bg-white/70 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-40">
            <div>
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">{% block page_title %}Trang chủ{% endblock %}</h2>
                <p class="text-sm text-slate-500 font-medium">Cập nhật lúc: <span class="text-emerald-600">Tháng 10/2026</span></p>
            </div>
            
            <div class="flex items-center gap-4">
                <button class="relative w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-emerald-600 hover:border-emerald-300 hover:shadow-md transition-all flex items-center justify-center">
                    <i class="fa-regular fa-bell"></i>
                    <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 border-2 border-white rounded-full"></span>
                </button>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div class="flex-1 overflow-y-auto p-8 bg-slate-50">
            <div class="max-w-7xl mx-auto">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

</body>
</html>
